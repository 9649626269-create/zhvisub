name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 3. Cài đặt Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Chấp nhận Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 5. Cài đặt thư viện Web (npm ci)
        run: |
          cd web
          npm ci

      - name: 6. Build Next.js Static Export
        run: |
          cd web
          npm run build

      - name: 7. Đồng bộ Capacitor vào Android
        run: |
          cd web
          npx cap sync android

      - name: 8. Cấp quyền thực thi cho gradlew
        run: |
          chmod +x web/android/gradlew

      - name: 9. Biên dịch APK (Gradle assembleDebug)
        run: |
          cd web/android
          ./gradlew assembleDebug --stacktrace

      - name: 10. Upload APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhvisub-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
